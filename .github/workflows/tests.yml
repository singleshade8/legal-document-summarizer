name: Python tests and source package

on:
  push:
    branches:
      - main
      - "improve/**"
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt reportlab
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package improved source code
        run: git archive --format=zip --prefix=legal-document-summarizer/ HEAD -o legal-document-summarizer-improved.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: legal-document-summarizer-improved
          path: legal-document-summarizer-improved.zip
          if-no-files-found: error
          retention-days: 7
